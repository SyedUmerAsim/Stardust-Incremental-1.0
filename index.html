<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardust Incremental</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <p id="stardustcount">0 Stardust</p>
    <br>
    <div><button onclick="uploadProject()" id="uploadproject"><img src="rocket.png" alt="Rocket png" height="85"></button></div>
    <br>
    <div class="increaseStardustGain">Increase Stardust Gain(+1/lvl)
        <button onclick="buyStardustPerUpload()" id="buyStardustPerUpload">current level 1, next-cost: 10 Stardust</button>
    </div>
    <br> 
    <div class="helpers">Buy Helpers(more stardust per upload)(upg1*lvl)
        <button onclick="buyHelpers()" id="buyHelpers">current level 1, next-cost: 1500 Stardust</button>
    </div>
    <br>
    <div class="coffee">chug some coffee and double your total stardust gain
        <button onclick="buyCoffee()" id="buyCoffee">cost: 3000 Stardust</button>
    </div>
    <br>
    <div class="blessed">1.2x boost to stardust gain! 
        <button onclick="getBlessed()" id="getBlessed">cost: 5000 Stardust</button>
    </div>

    
    
    <script src="index.js"></script>
</body>
</html>
